name: Refresh

# Once a day: take a snapshot of Roblox's public game data, rebuild the site, deploy.
# Same time every day (afternoon in the US) so days compare fairly.
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch: # the "Refresh now" link on the site opens this; press "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect a snapshot
        run: node scripts/collect.mjs
      - name: Build the site
        run: node scripts/build.mjs
      - name: Commit the new data
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%FT%H:%MZ)"
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
